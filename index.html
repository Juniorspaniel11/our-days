<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Our Days</title>
<meta name="theme-color" content="#f4f1f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#110e1a" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Our Days">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&family=Fredoka:wght@500;600;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: header with photo and both clocks, then one column of soft cards, floating tab bar. Light and dark themes */
:root{
  --bg:#f4f1f7; --card:#ffffff; --ink:#1f1830; --muted:#675f7c; --line:#e8e2ef;
  --accent:#cf3d66; --accent-soft:#fce7ee; --calm:#4a4fb3; --calm-soft:#ecedfc;
  --done:#2a8a62; --on-accent:#ffffff; --warn:#a85d10; --warn-soft:#fdf0de;
  --shadow:0 1px 2px rgba(31,24,48,.05),0 12px 32px rgba(31,24,48,.07);
  --display:"Manrope","Segoe UI",system-ui,sans-serif;
  --body:"DM Sans","Segoe UI",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#110e1a; --card:#1b1727; --ink:#f2eef8; --muted:#a69fba; --line:#2c273c;
  --accent:#ff7d9d; --accent-soft:#3a1d2b; --calm:#a3abff; --calm-soft:#22244d;
  --done:#6fd3a3; --on-accent:#16121f; --warn:#f3b56c; --warn-soft:#3a2a17;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 32px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#110e1a; --card:#1b1727; --ink:#f2eef8; --muted:#a69fba; --line:#2c273c;
  --accent:#ff7d9d; --accent-soft:#3a1d2b; --calm:#a3abff; --calm-soft:#22244d;
  --done:#6fd3a3; --on-accent:#16121f; --warn:#f3b56c; --warn-soft:#3a2a17;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 32px rgba(0,0,0,.25); color-scheme:dark}
html{-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
*,*::before,*::after{box-sizing:border-box}
body{background:var(--bg);transition:background .3s;color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5;padding-bottom:calc(170px + env(safe-area-inset-bottom,0px))}
button{font:inherit;color:inherit}
input,select,textarea{font:inherit}
input:focus-visible,button:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.hin,main.wrap{max-width:560px;margin:0 auto;width:100%}
main.wrap{display:flex;flex-direction:column;gap:22px;padding-top:20px}
main.wrap>*,section{min-width:0}

/* header */
.top{padding-block:14px 0}
.hin{display:flex;flex-direction:column;gap:16px}
.pv{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--muted);border:1px dashed var(--line);border-radius:14px;padding:6px 10px}
.seg{display:inline-flex;border-radius:999px;overflow:hidden;background:var(--card);border:1px solid var(--line)}
.seg button{border:0;background:none;padding:3px 14px;cursor:pointer;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);font-weight:600}
.pv .reset{margin-left:auto;background:none;border:0;text-decoration:underline;color:var(--muted);cursor:pointer;font-size:13px}
header{display:flex;align-items:center;gap:16px;position:relative}
header .gear{position:absolute;top:0;right:0}
header .eyebrow,header h1{padding-right:96px}
.avatar{flex:none;width:96px;height:96px;border-radius:50%;padding:3px;cursor:pointer;border:0;
  background:conic-gradient(from 210deg,var(--accent),var(--calm),var(--accent));box-shadow:var(--shadow)}
.avatar span,.avatar img{width:100%;height:100%;border-radius:50%;display:flex;align-items:center;justify-content:center;object-fit:cover;
  border:3px solid var(--bg);background:var(--accent-soft);font-family:var(--display);font-weight:800;font-size:36px;color:var(--accent)}
.htext{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}
.eyebrow{font-size:12.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:600;color:var(--muted)}
h1{font-family:var(--display);font-weight:800;font-size:clamp(26px,7.5vw,36px);line-height:1.08;margin:0;text-wrap:balance;letter-spacing:-.02em}
.tzs{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.tz{display:inline-flex;align-items:center;gap:6px;font-size:13px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px 10px 3px 3px;white-space:nowrap}
.tz i{width:22px;height:22px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-style:normal;font-weight:700;font-size:11px;display:flex;align-items:center;justify-content:center}
.tz.them i{background:var(--calm-soft);color:var(--calm)}
.tz b{font-family:var(--mono);font-weight:500;font-size:13px}
.tz span{color:var(--muted)}
.gear{align-self:flex-start;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 12px;cursor:pointer;font-size:14px}
.stars{position:absolute;inset:0;pointer-events:none;
  background-image:radial-gradient(1.6px 1.6px at 8% 22%,#fff,transparent),radial-gradient(1.2px 1.2px at 18% 64%,#fffc,transparent),radial-gradient(1.4px 1.4px at 31% 30%,#fff,transparent),
  radial-gradient(1px 1px at 42% 78%,#fffb,transparent),radial-gradient(1.6px 1.6px at 55% 18%,#fff,transparent),radial-gradient(1.1px 1.1px at 63% 55%,#fffc,transparent),
  radial-gradient(1.3px 1.3px at 74% 36%,#fff,transparent),radial-gradient(1px 1px at 86% 70%,#fffb,transparent),radial-gradient(1.5px 1.5px at 93% 26%,#fff,transparent)}
.nowtag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--on-accent);background:var(--accent);border-radius:999px;padding:1px 8px;margin-right:6px;vertical-align:2px}
.nowtag.next{background:var(--calm-soft);color:var(--calm)}
.ev.cur .what b{color:var(--accent)}
.seg2{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.seg2 button{border:0;background:none;padding:6px 16px;cursor:pointer;font-size:15px}
.seg2 button[aria-pressed="true"]{background:var(--ink);color:var(--bg);font-weight:600}
@media (max-width:420px){.avatar{width:80px;height:80px}.avatar span{font-size:30px}header{gap:12px}}

/* generic */
section{display:flex;flex-direction:column;gap:10px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px;box-shadow:var(--shadow)}
.sechead{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
h2{font-family:var(--display);font-weight:700;font-size:21px;line-height:1.2;margin:0;letter-spacing:-.01em}
.subhead{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-top:6px;padding-top:12px;border-top:1px solid var(--line)}
.subhead b{font-weight:600}
.hint{color:var(--muted);font-size:15px;margin:0}
.lbl{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
.link{background:none;border:0;color:var(--accent);cursor:pointer;padding:2px 0;text-decoration:underline;text-underline-offset:3px;font-size:15px}
.primary{background:var(--accent);color:var(--on-accent);border:0;border-radius:999px;padding:8px 16px;cursor:pointer;font-weight:600;font-size:15px;box-shadow:0 6px 16px color-mix(in srgb,var(--accent) 30%,transparent)}
.ghost{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:7px 14px;cursor:pointer;font-size:15px}
.quiet{background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;font-size:15px;padding:2px 0}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tag{display:inline-block;font-size:12px;font-weight:600;letter-spacing:.04em;border-radius:999px;padding:1px 9px;background:var(--calm-soft);color:var(--calm)}
.tag.ex{background:var(--warn-soft);color:var(--warn)}
.empty{color:var(--muted);font-size:15px;margin:0}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:14px;color:var(--muted)}
.inp{font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:9px 11px;min-width:0;width:100%}
.check{display:flex;align-items:center;gap:10px;font-size:16px;cursor:pointer}
input[type=checkbox]{width:22px;height:22px;accent-color:var(--done);flex:none;margin:0}
.msg{font-size:14px;color:var(--accent)}

/* category colors: solid, same in both themes, white text passes contrast on each */
.cat{display:inline-block;font-size:11.5px;font-weight:700;letter-spacing:.04em;color:#fff;border-radius:999px;padding:1px 8px;margin-right:6px;vertical-align:1px}
.timeline{border-left:0!important;margin-left:0!important;gap:8px}
.ev{padding:10px 12px 10px 12px!important;border-radius:14px;border-left:5px solid var(--cc,var(--muted));background:color-mix(in srgb,var(--cc,var(--muted)) 10%,var(--card))}
.ev::before{display:none!important}
.ev.cur{box-shadow:inset 0 0 0 1.5px var(--cc)}
.catpick{display:flex;flex-wrap:wrap;gap:6px}
.catpick label{position:relative;cursor:pointer}
.catpick input{position:absolute;opacity:0;width:1px;height:1px}
.catpick span{display:inline-block;color:#fff;font-size:14px;font-weight:600;border-radius:999px;padding:5px 12px;opacity:.55;border:2px solid transparent}
.catpick input:checked+span{opacity:1;border-color:var(--ink)}
.catpick input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.now.solid{color:#fff}
.now.solid .lbl,.now.solid span{color:rgba(255,255,255,.88)}
.dots2{display:flex;gap:3px;justify-content:center;min-height:7px;margin-top:2px}
.dots2 i{width:7px;height:7px;border-radius:50%;display:block}
/* now */
.now{border-radius:20px;padding:14px 16px;display:flex;flex-direction:column;gap:3px;background:linear-gradient(135deg,var(--accent-soft),var(--calm-soft))}
.now .lbl{color:var(--accent)}
.now b{font-family:var(--display);font-weight:700;font-size:21px;line-height:1.15;overflow-wrap:anywhere}
.now span{color:var(--muted);font-size:16px}
.now .row{margin-top:6px}

/* countdowns */
.strip{display:flex;gap:12px;overflow-x:auto;padding:2px 2px 8px;scroll-snap-type:x mandatory;max-width:100%}
.cd{flex:none;scroll-snap-align:start;width:158px;min-height:168px;border-radius:20px;padding:14px;border:0;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:2px;
  background:var(--cdc,#5b6475);color:#fff;box-shadow:var(--shadow);position:relative;overflow:hidden}
.cd::after{content:"";position:absolute;right:-30px;bottom:-30px;width:110px;height:110px;border-radius:50%;background:rgba(255,255,255,.1);pointer-events:none}
.cd .kick{font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:rgba(255,255,255,.85)}
.cd .num{font-family:var(--display);font-weight:800;font-size:40px;line-height:1.05;font-variant-numeric:tabular-nums;color:#fff;margin-top:4px}
.cd .unit{font-size:13px;color:rgba(255,255,255,.88)}
.cd .ttl{font-weight:700;font-size:15px;line-height:1.3;overflow-wrap:anywhere;margin-top:auto;padding-top:8px}
.cd .dt{font-size:13px;color:rgba(255,255,255,.88);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cd .soonchip{position:absolute;top:12px;right:12px;background:#fff;color:var(--cdc);font-size:11px;font-weight:800;border-radius:999px;padding:1px 8px}
.cdgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cdgrid .cd{width:auto}
.cdlist{display:flex;flex-direction:column;gap:8px}
.cdrow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;border-left:5px solid var(--cdc);border-radius:14px;padding:10px 14px 10px 12px;
  background:color-mix(in srgb,var(--cdc) 10%,var(--card));cursor:pointer;color:var(--ink)}
.cdrow .ttl{flex:1;min-width:0;font-weight:600;overflow-wrap:anywhere}
.cdrow small{display:block;color:var(--muted);font-size:13.5px;font-weight:400}
.cdrow .n{flex:none;text-align:right;font-family:var(--display);font-weight:800;font-size:24px;line-height:1.1}
.cdrow .n small{font-size:12px;font-weight:500}
.cd.pin .ttl{font-family:var(--display);font-weight:800;font-size:20px;margin-top:6px;padding-top:0}
.cd.pin .dt{margin-top:auto}
.cd.add{align-items:center;justify-content:center;color:var(--muted);border:2px dashed var(--line);width:110px;font-size:15px;background:transparent;box-shadow:none}
.cd.add::after{display:none}

/* schedule */
.timeline{display:flex;flex-direction:column;border-left:2px solid var(--line);margin-left:10px}
.ev{padding:9px 0 9px 14px;position:relative}
.ev::before{content:"";position:absolute;left:-7px;top:15px;width:12px;height:12px;border-radius:50%;background:var(--card);border:2px solid var(--muted)}
.ev.rep::before{border-color:var(--accent);background:var(--accent)}
.ev.done::before{border-color:var(--done);background:var(--done)}
.ev.past{opacity:.7}
.evrow{display:grid;grid-template-columns:24px 84px 1fr;gap:10px;align-items:start}
.evrow.ro{grid-template-columns:84px 1fr}
.t{font-family:var(--mono);font-size:13.5px;color:var(--muted);font-variant-numeric:tabular-nums;padding-top:2px;line-height:1.35}
.what{min-width:0}.what b{display:block;font-weight:600;overflow-wrap:anywhere}
.what small{display:block;color:var(--muted);font-size:15px}
.what .row{margin-top:2px;gap:14px}
.ev.done .what b,.ev.skip .what b{text-decoration:line-through;color:var(--muted)}
@media (max-width:420px){.evrow{grid-template-columns:24px 72px 1fr}.evrow.ro{grid-template-columns:72px 1fr}}

/* tasks */
.tasks{display:flex;flex-direction:column}
.task{display:flex;align-items:center;gap:10px;padding:5px 0;border-bottom:1px solid var(--line)}
.task .tx{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);padding:6px 0;outline:none;font-size:17px;resize:none;overflow:hidden;line-height:1.4;font-family:inherit;field-sizing:content}
.task.done .tx{text-decoration:line-through;color:var(--muted)}
.tfoc{display:flex;align-items:center;gap:6px;flex:none}.tmin{font-size:12px;font-weight:700;color:var(--accent);white-space:nowrap}
.fbtn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:3px 10px;font-size:12.5px;font-weight:600;cursor:pointer;white-space:nowrap}.fbtn.big{align-self:flex-start;margin:4px 0 6px;padding:7px 14px;font-size:14px}.fbtn.on{background:var(--accent);border-color:var(--accent);color:#fff}
.ev.todo .tx{width:100%;border:0;background:transparent;color:var(--ink);padding:0;outline:none;font:inherit;font-weight:600;resize:none;overflow:hidden;line-height:1.4;field-sizing:content}.ev.todo.done .tx{text-decoration:line-through;color:var(--muted)}
.carried{font-size:12px;font-weight:600;color:var(--warn);background:var(--warn-soft);border-radius:999px;padding:1px 9px;white-space:nowrap}
.addtask{display:flex;gap:8px;margin-top:10px}
.addtask .inp{flex:1}

/* habits */
.habit{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.habit:first-child{border-top:0}
.habit .what{flex:1}
.bar{height:7px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--calm));border-radius:99px}
.streak{color:var(--accent);font-weight:600}

/* projects */
.papers .plist{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.paper{border:1px solid var(--line);border-radius:14px;padding:8px 10px;display:flex;flex-direction:column;gap:8px;background:color-mix(in srgb,var(--accent) 4%,var(--card))}
.paper .ptop{display:flex;gap:10px;align-items:center;width:100%;border:0;background:none;padding:0;font:inherit;color:inherit;text-align:left;cursor:pointer}.paper .ptx{flex:1}.pcaret{color:var(--muted);font-size:14px}.paper .pchip{margin-right:6px;padding:1px 8px;font-size:11.5px;vertical-align:1px}.paper .ptx{min-width:0;display:flex;flex-direction:column}.paper .ptx b{font-size:15px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.pmeta{font-size:12.5px;color:var(--muted);margin-top:2px}
.pbar{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.pbar i{height:6px;border-radius:3px;background:var(--line)}.pbar i.on{background:color-mix(in srgb,var(--accent) 55%,var(--card))}.pbar i.cur{background:var(--accent)}
.pstep{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:2px;align-items:center;position:relative}
.pstep::before{content:"";position:absolute;left:6%;right:6%;top:50%;height:3px;background:var(--line);border-radius:2px;z-index:0}
.pst{position:relative;z-index:1;justify-self:center;width:31px;height:31px;border-radius:50%;border:2px solid var(--line);background:var(--card);display:grid;place-items:center;padding:0;cursor:pointer;filter:grayscale(1);opacity:.55;transition:transform .15s}
.pst.on{filter:none;opacity:.85;border-color:color-mix(in srgb,var(--accent) 45%,var(--card))}
.pst.cur{filter:none;opacity:1;width:38px;height:38px;border-color:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 18%,transparent)}
.pst:not(:disabled):active{transform:scale(.9)}.pst:disabled{cursor:default}.pst img,.pst span{pointer-events:none}
.parr{border:1px solid var(--line);background:var(--card);color:var(--ink);width:30px;height:30px;border-radius:50%;font-size:18px;line-height:1;cursor:pointer;padding:0}
.prow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.pchip{background:var(--accent);color:#fff;border-radius:999px;padding:2px 10px;font-size:13px;font-weight:700}
.pwhen{font-size:14px;color:var(--muted);font-weight:600}.pwhen.hot{color:var(--accent)}
.pnext{font-size:15px}.pnext .lbl{margin-right:6px}
.psum{display:flex;flex-direction:column;gap:8px}.psum>b{font-size:20px}
.pcounts{display:flex;flex-wrap:wrap;gap:6px}.pc1{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:999px;padding:2px 8px 2px 5px;font-size:12.5px;background:var(--card)}
.pedit{display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--line);padding-top:10px}
.pubtile{display:flex;align-items:center;gap:10px;padding:8px 12px;margin-bottom:10px;border-radius:14px;background:color-mix(in srgb,var(--accent) 9%,var(--card));border:1px solid color-mix(in srgb,var(--accent) 22%,var(--line))}.pubtile .ptx{flex:1;min-width:0;display:flex;flex-direction:column}.pubtile .ptx b{font-size:16px}.pubtile .ptx span{font-size:12.5px;color:var(--muted)}
.pubrow{display:flex;align-items:center;gap:8px;margin-top:12px;padding-top:10px;border-top:1px solid var(--line)}.pubrow b{flex:1;font-size:16px}
.pubhead{display:flex;align-items:center;gap:8px;width:100%;margin-top:14px;padding:10px 0 0;border:0;border-top:1px solid var(--line);background:none;color:var(--ink);font:inherit;cursor:pointer;text-align:left}.pubhead b{flex:1}.pubhead span{color:var(--accent);font-weight:600;font-size:14px}
.publist{margin:8px 0 0;padding-left:22px;display:flex;flex-direction:column;gap:8px}.publist li b{display:block}.publist li span{display:block;font-size:14px;color:var(--muted)}
.projs{display:flex;flex-direction:column;gap:10px}
.pj{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:0 12px 10px;display:flex;flex-direction:column;gap:6px;overflow:hidden}
.pjband{margin:0 -12px 2px;padding:9px 12px;background:var(--pc);color:#fff}.pjband .pjp{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.45);color:#fff}.pjband .pjp[aria-pressed="true"]{background:#fff;border-color:#fff;color:var(--pc)}
.pj.focus{box-shadow:0 0 0 2px color-mix(in srgb,var(--pc) 35%,transparent)}
.pjtop{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.pjtop b{flex:1 1 140px;font-size:16px;line-height:1.25;overflow-wrap:anywhere}
.pjp{border:1px solid var(--line);background:var(--card);color:var(--muted);border-radius:999px;padding:2px 9px;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap}

.pjrow{display:flex;flex-wrap:wrap;gap:6px;align-items:center}.pjrow .msg{font-size:12.5px;color:var(--muted)}
.proj{display:flex;flex-direction:column;gap:8px}

.proj .phead{margin:-16px -16px 4px;padding:14px 16px;background:var(--pc);color:#fff}
.proj .pill{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.4);color:#fff}
.proj .pill[aria-pressed="true"],.proj .pill.pinp[aria-pressed="true"]{background:#fff;border-color:#fff;color:var(--pc)}
.phead{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.phead b{font-family:var(--display);font-weight:700;font-size:19px;line-height:1.1;overflow-wrap:anywhere}
.pills{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.pill{font-size:13px;white-space:nowrap;border:1px solid var(--line);background:var(--bg);color:var(--muted);border-radius:999px;padding:3px 10px;cursor:pointer}
.pill[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.pill.pinp[aria-pressed="true"]{background:#3a2a6a;border-color:#3a2a6a;color:#fff}
.meta{font-size:15px;color:var(--muted)}
.meta .soon{color:var(--accent);font-weight:600}
.tracker{display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--line);padding-top:8px}
.trow{display:grid;grid-template-columns:1fr 128px auto;gap:8px;align-items:center}
.trow a{color:var(--ink);font-weight:500;overflow-wrap:anywhere}
.trow select{font-size:15px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:5px 6px}
.x{background:none;border:0;color:var(--muted);cursor:pointer;font-size:20px;padding:0 6px;line-height:1}
.fsum{display:flex;flex-direction:column;gap:8px}
.fsum .frow{display:grid;grid-template-columns:1fr 70px;gap:10px;align-items:center;font-size:15px}
.fsum .frow span:last-child{font-family:var(--mono);text-align:right;color:var(--muted)}

/* week */
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.wk2 .day{padding:6px 2px 4px;border-radius:12px}.wk2 .day .num{font-size:18px}.wk2 .dots{color:var(--accent);font-size:13px;line-height:1;height:12px;letter-spacing:1px}.wk2 .day.sel .dots{color:#fff}
.wksec .sechead{margin-bottom:8px}
.day{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px 2px;text-align:center;font-size:12.5px;color:var(--muted);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px;box-shadow:var(--shadow)}
.day b{font-size:14px;color:var(--ink)}
.day .num{font-family:var(--display);font-weight:700;font-size:20px;line-height:1.1;color:var(--ink)}

.day.sel{background:linear-gradient(165deg,#3a2a6a,#8a3a6e);border-color:transparent;color:#fff}
.day.sel b,.day.sel .num{color:#fff}
.nav{display:flex;gap:6px}
.nav button{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:4px 12px;cursor:pointer;font-size:15px}

/* us */
.duo{display:grid;grid-template-columns:1fr 1fr;border-radius:26px;overflow:hidden;box-shadow:var(--shadow)}
.city{position:relative;overflow:hidden;color:#fff;padding:16px 14px 46px;background:linear-gradient(165deg,var(--s1),var(--s2) 58%,var(--s3))}
.city::after{content:"";position:absolute;width:140px;height:140px;right:-40px;top:-50px;border-radius:50%;background:radial-gradient(circle,var(--orb),transparent 68%);pointer-events:none}
.city>*{position:relative;z-index:1}
.city .who{font-size:13px;letter-spacing:.1em;text-transform:uppercase;font-weight:600;opacity:.92}

.city .pl{font-size:14px;opacity:.9}
.together{background:var(--c-love,#8c2f55);color:#fff;border:0;border-radius:22px;padding:16px;box-shadow:var(--shadow);text-align:center;display:flex;flex-direction:column;align-items:center;gap:2px}

.tbox{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:100%;margin:8px 0 4px}
.tb{background:rgba(255,255,255,.14);border-radius:14px;padding:10px 4px;display:flex;flex-direction:column;align-items:center}
.tb b{font-family:var(--display);font-weight:800;font-size:clamp(26px,8vw,36px);line-height:1.05;font-variant-numeric:tabular-nums}
.tb span{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.85)}
.together .dt{color:rgba(255,255,255,.88);font-size:15px}
.together .lbl{color:rgba(255,255,255,.85)}
.together .ghost{background:#fff;color:#8c2f55;border:0;font-weight:600}
.pray{background:linear-gradient(165deg,#14244f,#22397a 55%,#2e4d93);color:#fff;border:0;position:relative;overflow:hidden}
.pray>*{position:relative;z-index:1}
.pray .stars{opacity:.7;z-index:0}
.pray h2{color:#fff}.pray .hint,.pray .meta{color:rgba(255,255,255,.78)}
.pray .streak{color:#ffd27a}
.pray .inp{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.25);color:#fff;color-scheme:dark}
.pray input[type=checkbox]{accent-color:#ffd27a}
.pray .done{color:#ffd27a;font-weight:600}
.dots{display:flex;gap:7px;flex-wrap:wrap}
.dots i{width:14px;height:14px;border-radius:50%;background:rgba(255,255,255,.18);display:block}
.dots i.on{background:#ffd27a;box-shadow:0 0 10px rgba(255,210,122,.7)}
.pcard{display:flex;flex-direction:column;gap:12px}
.pchead{display:flex;align-items:center;gap:12px}
.mini{width:48px;height:48px;border-radius:50%;background:var(--calm-soft);color:var(--calm);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:800;font-size:20px;flex:none;overflow:hidden}
.mini img{width:100%;height:100%;object-fit:cover}
.ro-list{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.ro-list li{display:flex;gap:8px;align-items:baseline;font-size:16px}
.ro-list li .st{font-family:var(--mono);font-size:13px;color:var(--muted);flex:none;width:18px}
.ro-list li.ok{color:var(--muted);text-decoration:line-through}
.plan{display:flex;align-items:center;gap:10px;padding:7px 0;border-top:1px solid var(--line)}
.plan:first-child{border-top:0}
.plan span{flex:1;overflow-wrap:anywhere}
.plan.ok span{text-decoration:line-through;color:var(--muted)}

/* tab bar */
.tabbar{position:fixed;z-index:20;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));width:min(calc(100% - 32px),480px);
  background:color-mix(in srgb,var(--card) 86%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border:1px solid var(--line);border-radius:26px;box-shadow:0 12px 34px rgba(31,24,48,.18);display:grid;grid-template-columns:repeat(4,1fr);padding:6px}
.tabbar button{background:none;border:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 0;font-size:12.5px;color:var(--muted);border-radius:20px}
.tabbar svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabbar button[aria-current="page"]{color:var(--ink);font-weight:700;background:color-mix(in srgb,var(--ink) 11%,transparent)}

/* timer bar */
.timerbar{position:fixed;left:0;right:0;z-index:19;bottom:calc(90px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.timerbar .in{max-width:480px;width:100%;background:linear-gradient(135deg,#2b2458,#7a3466);color:#fff;border-radius:20px;padding:10px 14px;display:flex;align-items:center;gap:12px;box-shadow:0 10px 28px rgba(31,24,48,.3)}
.timerbar .in div{flex:1;min-width:0}
.timerbar small{display:block;font-size:12px;opacity:.8;letter-spacing:.08em;text-transform:uppercase}
.timerbar b{display:block;overflow-wrap:anywhere}
.timerbar .clk{font-family:var(--mono);font-size:22px;font-variant-numeric:tabular-nums;flex:none}
.timerbar button{background:#fff;color:#2b2458;border:0;border-radius:999px;padding:7px 14px;font-weight:600;cursor:pointer}

/* sheet */
.sheet{position:fixed;inset:0;z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet .bd{position:absolute;inset:0;background:rgba(17,12,30,.45);backdrop-filter:blur(2px)}
.sheet .pn{position:relative;background:var(--card);width:100%;max-width:560px;max-height:88vh;overflow:auto;border-radius:26px 26px 0 0;
  padding:18px max(16px,env(safe-area-inset-right,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
.sheet .sh{display:flex;align-items:center;justify-content:space-between;gap:10px}
.sheet h3{font-family:var(--display);font-weight:700;font-size:23px;margin:0;overflow-wrap:anywhere;line-height:1.1}
.sheet .body{display:flex;flex-direction:column;gap:12px}
.dows{display:flex;gap:4px;flex-wrap:wrap}
.dows label{display:flex;align-items:center;justify-content:center;width:40px;height:34px;border:1px solid var(--line);border-radius:10px;font-size:14px;cursor:pointer;user-select:none}
.dows input{position:absolute;opacity:0;width:1px;height:1px}
.dows label:has(input:checked){background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.cp{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.cp .what{flex:1}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.setrow input[type=time]{width:auto}

/* toast */
.toast{position:fixed;z-index:60;top:calc(10px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);width:min(92vw,420px);
  background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border:1px solid var(--line);border-radius:22px;padding:12px 14px;box-shadow:0 14px 34px rgba(0,0,0,.2);display:flex;gap:12px;align-items:flex-start}
.toast .ic{width:38px;height:38px;border-radius:11px;background:linear-gradient(160deg,#3a2a6a,#cf3d66);color:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:800;font-size:15px;flex:none}
.toast small{display:block;color:var(--muted);font-size:13px}
.toast b{display:block;font-size:15px}
.toast p{margin:0;font-size:15px}
@media (prefers-reduced-motion:no-preference){.toast{animation:drop .35s ease-out}@keyframes drop{from{transform:translate(-50%,-20px);opacity:0}}
  main.wrap>*{animation:rise .4s ease-out both}main.wrap>*:nth-child(2){animation-delay:.04s}main.wrap>*:nth-child(3){animation-delay:.08s}main.wrap>*:nth-child(4){animation-delay:.12s}
  @keyframes rise{from{transform:translateY(8px)}}}
html,body{margin:0}
:root{padding-top:env(safe-area-inset-top,0px)}

  padding:calc(40px + env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) 40px max(20px,env(safe-area-inset-left,0px))}

  const cutoff=addDays(tzNow(p.tz).key,-120);
  if(p.focus)Object.keys(p.focus).forEach(k=>{if(k<cutoff)delete p.focus[k]});
  const {days,partner,photo,loaded,photoLoaded,daysLoaded,cal,...doc}=p;
  put("person",personRef(ME),doc);
  if(p.photoLoaded)put("photo",extraRef(ME),{photo:photo||null});
  for(const k in days){if(sent["day:"+k]===undefined&&!hasContent(days[k]))continue;put("day:"+k,dayRef(ME,k),days[k])}
  if(S.sharedLoaded)["countdowns","prayer","plans"].forEach(f=>{const v=js(S.shared[f]);if(sent["sh:"+f]===v)return;sent["sh:"+f]=v;
    sharedRef().set({[f]:clean(S.shared[f])},{mergeFields:[f]}).catch(syncErr)});
}
function put(key,ref,obj){const v=js(obj);if(sent[key]===v)return;sent[key]=v;ref.set(clean(obj)).catch(syncErr)}

function watchPerson(u,isMe){
  const list=isMe?unsubs:partnerUnsubs;
  list.push(personRef(u).onSnapshot(sn=>{
    if(sn.metadata.hasPendingWrites)return;
    if(isMe&&dirty&&S.people[u]&&S.people[u].loaded)return;
    const cur=S.people[u]||{};
    if(!sn.exists){if(isMe&&cur)cur.loaded=true;return}
    const d=sn.data();
    S.people[u]={...blankPerson(d.name||"",d.city||"",d.tz||"America/Chicago"),...d,days:cur.days||{},photo:cur.photo,avatar:cur.avatar,presence:cur.presence,status:cur.status,photoLoaded:cur.photoLoaded,partner:cur.partner,daysLoaded:cur.daysLoaded,cal:cur.cal,loaded:true};
    if(isMe)setTimeout(quickAdd,0);
    if(isMe)sent.person=js(d);
    link();softRender();
  },e=>console.warn(e)));
  const since=addDays(dkey(new Date()),-130);
  list.push(DB.collection("couples/"+CID+"/people/"+u+"/days").where(firebase.firestore.FieldPath.documentId(),">=",since).onSnapshot(qs=>{
    const p=S.people[u];if(!p)return;
    qs.docChanges().forEach(ch=>{const k=ch.doc.id;if(ch.type==="removed"){delete p.days[k];return}
      if(ch.doc.metadata.hasPendingWrites)return;p.days[k]=ch.doc.data();if(isMe)sent["day:"+k]=js(p.days[k])});
    if(isMe){p.daysLoaded=true;quickAdd()}
    softRender();
  },e=>console.warn(e)));
  list.push(DB.doc("couples/"+CID+"/people/"+u+"/extra/calendar").onSnapshot(sn=>{const p=S.people[u];if(!p)return;p.cal=sn.exists?sn.data():null;softRender()},()=>{}));
  list.push(statusRef(u).onSnapshot(sn=>{if(S.people[u])S.people[u].status=sn.exists?sn.data():null;softRender()},()=>{}));
  if(!isMe)list.push(DB.doc("couples/"+CID+"/people/"+u+"/extra/presence").onSnapshot(sn=>{if(S.people[u])S.people[u].presence=sn.exists?sn.data():null;softRender()},()=>{}));
  list.push(DB.doc("couples/"+CID+"/people/"+u+"/extra/avatar").onSnapshot(sn=>{if(S.people[u])S.people[u].avatar=sn.exists?sn.data().photo:null;softRender()},()=>{}));
  list.push(extraRef(u).onSnapshot(sn=>{if(sn.metadata.hasPendingWrites)return;const ph=sn.exists?sn.data().photo:null;
    if(S.people[u]){S.people[u].photo=ph;S.people[u].photoLoaded=true}if(isMe)sent.photo=js({photo:ph||null});softRender()},()=>{if(S.people[u])S.people[u].photoLoaded=true}));
}

function day(pid,k){const p=P(pid);const d=p.days[k]||(p.days[k]=blankDay());d.tasks=d.tasks||[];d.done=d.done||[];d.skip=d.skip||[];d.habits=d.habits||[];return d}
function addTask(pid,k,t){day(pid,k).tasks.push({id:uid(),t,d:false});persist()}
function itemsFor(pid,k){
  const p=P(pid),dow=parseKey(k).getDay(),d=day(pid,k);
  const r=p.routine.filter(x=>(x.days||[]).includes(dow)).map(x=>({...x,kind:"rep"}));
  const e=p.events.filter(x=>x.date===k).map(x=>({...x,kind:"one"}));
  const c=((p.cal&&p.cal.events)||[]).filter(x=>x.date===k).map(x=>({...x,kind:"cal"}));
  return r.concat(e,c).map(x=>{const s=x.allDay?-1:toMin(x.start);return {...x,s,e:x.allDay?-1:(toMin(x.end)??s+60),done:d.done.includes(x.id),skip:d.skip.includes(x.id)}}).sort((a,b)=>a.s-b.s);
}
function carry(pid){
  const p=P(pid),t=tzNow(p.tz).key;if(p.lastCarry===t)return;p.lastCarry=t;
  const td=day(pid,t);
  for(let i=7;i>=1;i--){const d=p.days[addDays(t,-i)];if(!d||!d.tasks)continue;
    d.tasks.forEach(it=>{if(it.t&&!it.d&&!it.m){td.tasks.push({id:uid(),t:it.t,d:false,c:true});it.m=true}})}
  persist();
}

function logFocus(pid,targetType,targetId,mins){

  persist();

  else if(n.min>=20*60){lab="Evening";head="Plan tomorrow";sub="Add tomorrow's tasks, then you're done for the day";btns.push(h("button",{type:"button",class:"ghost",onclick:()=>{ui.sel=addDays(n.key,1);ui.weekOff=0;go("today")}},"Open tomorrow"))}

function emo(e,size,anim){
  if(!e)return null;

  const cps=[...e].map(c=>c.codePointAt(0).toString(16)),cp=cps.filter(x=>x!=="fe0f").join("_");
  const srcs=[];if(anim&&!RM)srcs.push(NOTO_ANIM(cp));srcs.push(NOTO_PNG(cp,size>56));
  const left=srcs.filter(u=>!EMO_BAD.has(u));if(!left.length)return span();
  const img=h("img",{class:"emoimg",src:left[0],alt:"",width:String(size),height:String(size),"aria-hidden":"true",decoding:"async"});let i=0;
  img.onerror=()=>{EMO_BAD.add(left[i]);i++;if(i<left.length)img.src=left[i];else img.replaceWith(span())};return img}

  const d=Math.floor(sec/86400);sec-=d*86400;const hh=Math.floor(sec/3600);sec-=hh*3600;const mm=Math.floor(sec/60);const ss=sec-mm*60;
  el("vd").textContent=d;el("vh").textContent=pad(hh);el("vm").textContent=pad(mm);el("vs").textContent=pad(ss);
}
setInterval(tickVisit,1000);
/* ---------- timer bar ---------- */
function renderTimer(){
  const tb=el("timerbar"),t=S.timer;
  if(!t||t.pid!==me()){tb.hidden=true;tb.innerHTML="";return}
  tb.hidden=false;
  if(!tb.firstChild){tb.appendChild(h("div",{class:"in"},h("div",null,h("small",null,"Focus"),h("b",null,t.label)),h("span",{class:"clk",id:"clk"},"0:00"),h("button",{type:"button",onclick:stopTimer},"Stop")))}
  const s=Math.floor((Date.now()-t.start)/1000);el("clk").textContent=Math.floor(s/60)+":"+pad(s%60);
}
setInterval(()=>{if(S.timer)renderTimer()},1000);

/* ---------- shell ---------- */
function go(tab){S.tab=tab;persist();render();window.scrollTo({top:0})}
function render(){
  if(S.tab==="week")S.tab="today";
  if((S.tab==="us"||S.tab==="home")&&S.viewAs!==ME)S.viewAs=ME;
  const pid=me(),p=P(pid),o=P(partnerOf(pid)),n=tzNow(p.tz);
  document.querySelectorAll(".seg button").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.as===pid)));
  document.querySelectorAll(".tabbar button").forEach(b=>{if(b.dataset.tab===S.tab)b.setAttribute("aria-current","page");else b.removeAttribute("aria-current")});
  const av=el("avatar");av.innerHTML="";av.appendChild(p.photo?h("img",{src:p.photo,alt:o.name}):h("span",null,o.name[0]));
  av.setAttribute("aria-label",p.photo?o.name+"'s photo, change in settings":"Add "+o.name+"'s photo");
  el("eyebrow").textContent=parseKey(n.key).toLocaleDateString("en-US",{weekday:"long",month:"long",day:"numeric"});
  const greet=n.min<300?"Still up":n.min<720?"Good morning":n.min<1020?"Good afternoon":n.min<1320?"Good evening":"Good night";
  const RO=pid!==ME;document.body.classList.toggle("ro",RO);document.body.classList.toggle("tab-us",S.tab==="us");
  el("title").textContent=RO?{today:p.name+"'s day",projects:p.name+"'s projects",us:p.name+" & "+o.name,home:"Our home"}[S.tab]
    :{today:greet+", "+p.name,projects:"Your projects",us:p.name+" & "+o.name,home:"Our home"}[S.tab];
  const sl=el("subline");sl.innerHTML="";
  const pidP=partnerOf(ME);
  [ME,pidP].forEach(id=>{const x=P(id);if(!x)return;const ph=!!x.placeholder;
    const chip=(h("button",{type:"button",class:"tz"+(id!==ME?" them":"")+(id===pid&&!ph&&P(pidP)&&!P(pidP).placeholder?" on":""),disabled:ph,
      "aria-pressed":String(id===pid),"aria-label":ph?"Partner not joined yet":(id===ME?"Show my plan":"Show "+x.name+"'s plan"),
      onclick:()=>{if(ph||S.viewAs===id)return;if((S.tab==="us"||S.tab==="home")&&id!==ME)S.tab="today";S.viewAs=id;ui.sel=null;ui.weekOff=0;ui.habitEdit=false;ui.projEdit=null;render();window.scrollTo({top:0})}},
      h("i",{class:id!==ME&&presenceOf(id).on?"on":""},(x.name||"?")[0]),h("b",null,fmt(tzNow(x.tz).min)),h("span",null,x.city||"")));
    const row=h("div",{class:"tzrow"},chip);
    if(!ph&&S.tab!=="us"&&P(pidP)&&!P(pidP).placeholder){const st=statusOf(id),pr=presenceOf(id);
      row.appendChild(h("span",{class:"tzon"+(pr.on?" on":""),title:pr.on?"Online":pr.text||"Offline","aria-label":pr.on?"Online":pr.text||"Offline"}));
      row.appendChild(id===ME?h("button",{type:"button",class:"tzst mine",onclick:statusSheet,"aria-label":"Your status: "+st.t+". Tap to change",title:st.t},h("span",{class:"e"},st.e),h("span",{class:"t"},st.t),h("span",{class:"ed"},"✎"))
        :h("button",{type:"button",class:"tzst",onclick:()=>toast(nm(id)+(pr.on?" is online":" · "+(pr.text||"offline")),st.e+" "+st.t),title:st.t},h("span",{class:"e"},st.e),h("span",{class:"t"},st.t)))}
    sl.appendChild(row)});
  const th=S.theme||"system";if(th==="system")document.documentElement.removeAttribute("data-theme");else document.documentElement.setAttribute("data-theme",th);
  const main=el("main");main.innerHTML="";
  if(RO)main.appendChild(h("div",{class:"robar"},h("span",null,"Viewing "+p.name+"'s plan · read only"),
    h("button",{type:"button",onclick:()=>{S.viewAs=ME;ui.sel=null;ui.weekOff=0;render();window.scrollTo({top:0})}},"Back to mine")));
  const v={today:viewToday,projects:viewProjects,us:viewUs,home:viewHome}[S.tab]();
  v.filter(Boolean).forEach(x=>main.appendChild(x));
  renderTimer();
}
document.querySelectorAll(".tabbar button").forEach(b=>b.onclick=()=>go(b.dataset.tab));

/* ---------- updates: reload when a newer version is published ---------- */
const APP_VERSION="2026-11-13-d";
async function checkUpdate(){try{const r=await fetch("version.txt?t="+Date.now(),{cache:"no-store"});if(!r.ok)return;const v=(await r.text()).trim();
  if(v&&v!==APP_VERSION){const a=document.activeElement;if(a&&/^(INPUT|TEXTAREA)$/.test(a.tagName))return;if(navigator.serviceWorker&&navigator.serviceWorker.controller){const reg=await navigator.serviceWorker.getRegistration();if(reg)await reg.update().catch(()=>{})}location.reload()}}catch(e){}}
document.addEventListener("visibilitychange",()=>{if(!document.hidden)checkUpdate()});
setTimeout(checkUpdate,3000);setInterval(checkUpdate,15*60000);
/* ---------- boot ---------- */
(function boot(){
  if(!window.firebase||FIREBASE_CONFIG.apiKey.startsWith("PASTE")){gate("config");return}
  firebase.initializeApp(FIREBASE_CONFIG);
  AUTH=firebase.auth();DB=firebase.firestore();
  DB.enablePersistence({synchronizeTabs:true}).catch(()=>{});
  AUTH.onAuthStateChanged(async u=>{
    unsubs.forEach(f=>f());partnerUnsubs.forEach(f=>f());unsubs=[];partnerUnsubs=[];
    ME=null;CID=null;PARTNER=null;S.viewAs=null;S.people={};S.sharedLoaded=false;for(const k in sent)delete sent[k];
    el("sheet").hidden=true;
    if(!u){gate("signin");return}
    ME=u.uid;
    let prof=null;
    try{const us=await DB.doc("users/"+u.uid).get();prof=us.exists?us.data():null}
    catch(e){try{const us=await DB.doc("users/"+u.uid).get({source:"cache"});prof=us.exists?us.data():null}catch(_){}}
    if(!prof||!prof.cid){gate("profile");return}
    start(prof);
  });
  if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
})();
