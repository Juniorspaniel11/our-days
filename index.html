<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Our Days</title>
<meta name="theme-color" content="#f4f1f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#110e1a" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Our Days">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Crimson+Pro:ital,wght@0,500;0,700;1,500&family=Courier+Prime:wght@700&family=Manrope:wght@600;700;800&family=Fredoka:wght@500;600;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: header with photo and both clocks, then one column of soft cards, floating tab bar. Light and dark themes */
:root{
  --bg:#f4f1f7; --card:#ffffff; --ink:#1f1830; --muted:#675f7c; --line:#e8e2ef;
  --accent:#cf3d66; --accent-soft:#fce7ee; --calm:#4a4fb3; --calm-soft:#ecedfc;
  --done:#2a8a62; --on-accent:#ffffff; --warn:#a85d10; --warn-soft:#fdf0de;
  --shadow:0 1px 2px rgba(31,24,48,.05),0 12px 32px rgba(31,24,48,.07);
  --display:"Manrope","Segoe UI",system-ui,sans-serif;
  --body:"DM Sans","Segoe UI",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#110e1a; --card:#1b1727; --ink:#f2eef8; --muted:#a69fba; --line:#2c273c;
  --accent:#ff7d9d; --accent-soft:#3a1d2b; --calm:#a3abff; --calm-soft:#22244d;
  --done:#6fd3a3; --on-accent:#16121f; --warn:#f3b56c; --warn-soft:#3a2a17;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 32px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#110e1a; --card:#1b1727; --ink:#f2eef8; --muted:#a69fba; --line:#2c273c;
  --accent:#ff7d9d; --accent-soft:#3a1d2b; --calm:#a3abff; --calm-soft:#22244d;
  --done:#6fd3a3; --on-accent:#16121f; --warn:#f3b56c; --warn-soft:#3a2a17;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 32px rgba(0,0,0,.25); color-scheme:dark}
html{-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
*,*::before,*::after{box-sizing:border-box}
body{background:var(--bg);transition:background .3s;color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5;padding-bottom:calc(170px + env(safe-area-inset-bottom,0px))}
button{font:inherit;color:inherit}
input,select,textarea{font:inherit}
input:focus-visible,button:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.hin,main.wrap{max-width:560px;margin:0 auto;width:100%}
main.wrap{display:flex;flex-direction:column;gap:22px;padding-top:20px}
main.wrap>*,section{min-width:0}

/* header */
.top{padding-block:14px 0}
.hin{display:flex;flex-direction:column;gap:16px}
.pv{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--muted);border:1px dashed var(--line);border-radius:14px;padding:6px 10px}
.seg{display:inline-flex;border-radius:999px;overflow:hidden;background:var(--card);border:1px solid var(--line)}
.seg button{border:0;background:none;padding:3px 14px;cursor:pointer;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);font-weight:600}
.pv .reset{margin-left:auto;background:none;border:0;text-decoration:underline;color:var(--muted);cursor:pointer;font-size:13px}
header{display:flex;align-items:center;gap:16px;position:relative}
header .gear{position:absolute;top:0;right:0}
header .eyebrow,header h1{padding-right:96px}
.avatar{flex:none;width:96px;height:96px;border-radius:50%;padding:3px;cursor:pointer;border:0;
  background:conic-gradient(from 210deg,var(--accent),var(--calm),var(--accent));box-shadow:var(--shadow)}
.avatar span,.avatar img{width:100%;height:100%;border-radius:50%;display:flex;align-items:center;justify-content:center;object-fit:cover;
  border:3px solid var(--bg);background:var(--accent-soft);font-family:var(--display);font-weight:800;font-size:36px;color:var(--accent)}
.htext{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}
.eyebrow{font-size:12.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:600;color:var(--muted)}
h1{font-family:var(--display);font-weight:800;font-size:clamp(26px,7.5vw,36px);line-height:1.08;margin:0;text-wrap:balance;letter-spacing:-.02em}
.tzs{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.tz{display:inline-flex;align-items:center;gap:6px;font-size:13px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px 10px 3px 3px;white-space:nowrap}
.tz i{width:22px;height:22px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-style:normal;font-weight:700;font-size:11px;display:flex;align-items:center;justify-content:center}
.tz.them i{background:var(--calm-soft);color:var(--calm)}
.tz b{font-family:var(--mono);font-weight:500;font-size:13px}
.tz span{color:var(--muted)}
.gear{align-self:flex-start;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 12px;cursor:pointer;font-size:14px}
.stars{position:absolute;inset:0;pointer-events:none;
  background-image:radial-gradient(1.6px 1.6px at 8% 22%,#fff,transparent),radial-gradient(1.2px 1.2px at 18% 64%,#fffc,transparent),radial-gradient(1.4px 1.4px at 31% 30%,#fff,transparent),
  radial-gradient(1px 1px at 42% 78%,#fffb,transparent),radial-gradient(1.6px 1.6px at 55% 18%,#fff,transparent),radial-gradient(1.1px 1.1px at 63% 55%,#fffc,transparent),
  radial-gradient(1.3px 1.3px at 74% 36%,#fff,transparent),radial-gradient(1px 1px at 86% 70%,#fffb,transparent),radial-gradient(1.5px 1.5px at 93% 26%,#fff,transparent)}
.nowtag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#fff;background:#1f9e8f;border-radius:999px;padding:1px 8px;margin-right:6px;vertical-align:2px}
.nowtag.next{background:var(--calm-soft);color:var(--calm)}
.ev.cur .what b{color:#1f8a7d}
.seg2{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.seg2 button{border:0;background:none;padding:6px 16px;cursor:pointer;font-size:15px}
.seg2 button[aria-pressed="true"]{background:var(--ink);color:var(--bg);font-weight:600}
@media (max-width:420px){.avatar{width:80px;height:80px}.avatar span{font-size:30px}header{gap:12px}}

/* generic */
section{display:flex;flex-direction:column;gap:10px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px;box-shadow:var(--shadow)}
.sechead{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
h2{font-family:var(--display);font-weight:700;font-size:21px;line-height:1.2;margin:0;letter-spacing:-.01em}
.subhead{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-top:6px;padding-top:12px;border-top:1px solid var(--line)}
.subhead b{font-weight:600}
.hint{color:var(--muted);font-size:15px;margin:0}
.lbl{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
.link{background:none;border:0;color:var(--accent);cursor:pointer;padding:2px 0;text-decoration:underline;text-underline-offset:3px;font-size:15px}
.primary{background:var(--accent);color:var(--on-accent);border:0;border-radius:999px;padding:8px 16px;cursor:pointer;font-weight:600;font-size:15px;box-shadow:0 6px 16px color-mix(in srgb,var(--accent) 30%,transparent)}
.ghost{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:7px 14px;cursor:pointer;font-size:15px}
.quiet{background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;font-size:15px;padding:2px 0}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tag{display:inline-block;font-size:12px;font-weight:600;letter-spacing:.04em;border-radius:999px;padding:1px 9px;background:var(--calm-soft);color:var(--calm)}
.tag.ex{background:var(--warn-soft);color:var(--warn)}
.empty{color:var(--muted);font-size:15px;margin:0}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:14px;color:var(--muted)}
.inp{font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:9px 11px;min-width:0;width:100%}
.check{display:flex;align-items:center;gap:10px;font-size:16px;cursor:pointer}
input[type=checkbox]{width:22px;height:22px;accent-color:var(--done);flex:none;margin:0}
.msg{font-size:14px;color:var(--accent)}

/* category colors: solid, same in both themes, white text passes contrast on each */
.cat{display:inline-block;font-size:11.5px;font-weight:700;letter-spacing:.04em;color:#fff;border-radius:999px;padding:1px 8px;margin-right:6px;vertical-align:1px}
.timeline{border-left:0!important;margin-left:0!important;gap:8px}
.ev{padding:10px 12px 10px 12px!important;border-radius:14px;border-left:5px solid var(--cc,var(--muted));background:color-mix(in srgb,var(--cc,var(--muted)) 10%,var(--card))}
.ev::before{display:none!important}
.ev.cur{box-shadow:inset 0 0 0 2px var(--cc)}
.ev .what>b{font-size:17px}
.evrow input[type=checkbox]{width:24px;height:24px;accent-color:var(--done);margin-top:2px}
.kchips{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 2px}
.kchip{font-size:12px;font-weight:700;border-radius:999px;padding:1px 9px;background:color-mix(in srgb,var(--muted) 14%,transparent);color:var(--muted)}
.kchip.one{background:#ffe9a8;color:#7a4d00}
.kchip.miss{background:var(--warn-soft);color:var(--warn)}
.ev.missed{opacity:1!important;box-shadow:inset 0 0 0 2px var(--warn);background:color-mix(in srgb,var(--warn) 9%,var(--card))}
.ev.missed .what>b{color:var(--warn)}
.ev.done,.ev.skip{opacity:.62}
.donehd{font-size:12.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--done);margin:10px 0 0;padding-top:10px;border-top:1px dashed var(--line)}
.dhero{border-radius:28px;padding:18px 16px;color:#fff;display:flex;flex-direction:column;gap:12px;background:radial-gradient(120% 70% at 100% 0%,rgba(95,208,196,.35),transparent 60%),linear-gradient(155deg,#141b3d,#1d3557 55%,#185a63);box-shadow:0 18px 40px rgba(20,27,61,.35)}
.dhtop{display:flex;align-items:center;justify-content:space-between;gap:12px}
.dhtop small{font-size:12px;letter-spacing:.12em;text-transform:uppercase;font-weight:800;color:#8ee6da}
.dhtop h2{font-family:var(--display);font-weight:800;font-size:30px;margin:2px 0 2px;color:#fff;line-height:1.05}
.dsub{font-size:14.5px;opacity:.85}
.dring{--p:0;width:68px;height:68px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(#5fe0a8 calc(var(--p)*1%),rgba(255,255,255,.16) 0);flex:none}
.dring span{width:54px;height:54px;border-radius:50%;background:#1a2b4f;display:grid;place-items:center;font-weight:800;font-size:15px}
.dtiles{display:grid;grid-template-columns:minmax(0,1fr);gap:9px}
.dt{display:flex;align-items:flex-start;gap:12px;border-radius:18px;padding:12px 14px;min-height:0;background:linear-gradient(150deg,color-mix(in srgb,var(--tc) 92%,#fff),color-mix(in srgb,var(--tc) 72%,#141b3d));border:1px solid rgba(255,255,255,.14);color:#fff;min-width:0;box-shadow:0 8px 18px rgba(0,0,0,.2)}
.dt.wide{grid-column:1/-1}
.dt.exmp{opacity:.82;border:1.5px dashed rgba(255,255,255,.45);box-shadow:none}
.dt.exmp .dtick{color:#fff;font-size:20px}
.exl{display:block;margin-top:4px;font-size:11.5px;font-weight:700;opacity:.8}
.pjt.exmp:disabled,.papers.ms .paper.exmp:disabled{cursor:default}
.pjt.exmp{opacity:.8;border:2px dashed rgba(255,255,255,.55);box-shadow:none}
.papers.ms .paper.exmp{opacity:.75;border-style:dashed;border-left-style:solid;text-align:left;cursor:pointer;width:100%;font:inherit;color:inherit}
.dt.miss{box-shadow:0 0 0 3px #ffb347,0 8px 18px rgba(0,0,0,.2)}
.dt.miss .dtx small{display:inline-block;align-self:flex-start;max-width:calc(100% - 30px);background:#ffb347;color:#3a2200;border-radius:6px;padding:1px 6px;opacity:1}
.dt.cur{background:linear-gradient(135deg,color-mix(in srgb,var(--tc) 92%,#fff),color-mix(in srgb,var(--tc) 55%,#141b3d));padding:15px;box-shadow:0 0 0 2px rgba(255,255,255,.6),0 12px 28px color-mix(in srgb,var(--tc) 45%,transparent)}
.dt.cur .dtx b{font-size:22px}
.dt.one{box-shadow:0 0 0 2px #ffd36b,0 8px 18px rgba(0,0,0,.2)}
.dtick{width:34px;height:34px;border-radius:50%;border:2.5px solid rgba(255,255,255,.9);background:rgba(255,255,255,.14);color:rgba(255,255,255,.35);font-weight:900;font-size:17px;flex:none;cursor:pointer;display:grid;place-items:center;padding:0}
.dtick:hover,.dtick:active{background:#fff;color:var(--tc)}
.dtx{min-width:0;display:flex;flex-direction:column;gap:3px}
.dtx small{font-size:11.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;opacity:.92}
.dtx b{font-family:var(--display);font-weight:800;font-size:17px;line-height:1.2;overflow-wrap:break-word;word-break:normal;hyphens:auto}
@media (max-width:400px){.dtx b{font-size:16px}.dtx small{font-size:10.5px!important}.dt{padding:11px 10px;gap:8px}}
.dmore{font-size:13.5px;opacity:.85}
.fmb{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border-radius:22px;padding:14px 16px;cursor:pointer;color:#fff;border:1px solid rgba(255,211,107,.5);
  background:radial-gradient(circle at 85% 20%,rgba(255,255,255,.55) 0 1px,transparent 2px),radial-gradient(circle at 62% 80%,rgba(255,255,255,.4) 0 1px,transparent 2px),radial-gradient(120% 90% at 0% 0%,rgba(255,211,107,.32),transparent 60%),linear-gradient(135deg,#251a3d,#4a2f5e 55%,#7a5520);box-shadow:0 12px 28px rgba(60,35,20,.28)}
.fmbx{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.fmbx small{font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;font-weight:800;color:#ffd36b}
.fmbx b{font-family:"Crimson Pro",Georgia,serif;font-weight:700;font-style:italic;font-size:23px;line-height:1.2;color:#ffe1a1;text-shadow:0 0 18px rgba(255,211,107,.35)}
.fmbx span{font-size:13px;opacity:.85}
.fmbe{flex:none}
.vboard{border-radius:28px;padding:18px 16px;color:#fff;display:flex;flex-direction:column;gap:11px;border:1px solid rgba(255,211,107,.45);box-shadow:0 16px 36px rgba(40,25,60,.3);
  background:radial-gradient(circle at 10% 12%,rgba(255,255,255,.6) 0 1px,transparent 2px),radial-gradient(circle at 80% 8%,rgba(255,255,255,.5) 0 1px,transparent 2px),radial-gradient(circle at 45% 55%,rgba(255,255,255,.3) 0 1px,transparent 2px),radial-gradient(circle at 92% 70%,rgba(255,255,255,.45) 0 1px,transparent 2px),radial-gradient(110% 60% at 50% 115%,rgba(255,211,107,.35),transparent 60%),linear-gradient(165deg,#1c1530,#3a2550 55%,#5e3f1d)}
.vhead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.vhead small{font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:800;color:#ffd36b}
.vhead h2{margin:2px 0 0;font-family:"Crimson Pro",Georgia,serif;font-weight:700;font-size:30px;color:#ffe1a1;line-height:1.05}
.vsub{margin:0;font-size:14px;opacity:.85}
.vtog{display:flex;align-items:center;gap:10px;background:none;border:0;color:#fff;font:inherit;font-size:14px;font-weight:600;cursor:pointer;padding:0;text-align:left}
.vsw{position:relative;width:42px;height:24px;border-radius:999px;background:rgba(255,255,255,.25);flex:none;transition:background .2s}.vsw::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .2s}.vsw.on{background:#ffd36b}.vsw.on::after{left:21px}
.vbtn{border:1px solid rgba(255,211,107,.6);background:rgba(255,211,107,.12);color:#ffd36b;border-radius:999px;padding:7px 14px;font-weight:800;font-size:14px;cursor:pointer;white-space:nowrap}
.vbtn.solid{background:#ffd36b;color:#3a2550;border-color:#ffd36b}
.vplate{display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center;border-radius:18px;padding:14px 10px;background:linear-gradient(180deg,rgba(255,211,107,.22),rgba(255,211,107,.06));border:1.5px solid #ffd36b;box-shadow:inset 0 0 0 4px rgba(255,211,107,.08)}
.vplate small{font-size:12px;letter-spacing:.3em;text-transform:uppercase;font-weight:800;color:#ffd36b}
.vplate b{font-family:"Crimson Pro",Georgia,serif;font-weight:700;font-size:min(27px,6.6vw);line-height:1.15;color:#ffe1a1;white-space:nowrap;text-shadow:0 0 18px rgba(255,211,107,.4)}
.vk{color:#ffd36b;font-weight:700}.vmission .vk{font-weight:700}.vk.fn{color:#ffe7a8;font-weight:800;background:rgba(255,211,107,.16);border-radius:5px;padding:0 4px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.vmission{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;background:none;border:0;border-bottom:1px solid rgba(255,211,107,.3);color:#fff;padding:2px 8px 12px;cursor:pointer;font:inherit}
.vmission>small{font-size:11.5px;letter-spacing:.24em;text-transform:uppercase;font-weight:800;color:#ffd36b}
.vmission>span{font-family:"Crimson Pro",Georgia,serif;font-style:italic;font-weight:500;font-size:19.5px;line-height:1.35;color:#fff4dc}
.vmission.exm .exmt{font-family:"Crimson Pro",Georgia,serif;font-style:italic;font-size:18px;line-height:1.35;color:#fff4dc;opacity:.65}.vmission .exl2{font-size:11.5px;letter-spacing:0;text-transform:none;font-weight:600;opacity:.7}.vmission.exm{cursor:default;gap:8px}
.vmission.empty>span{font-style:normal;font-size:15px;color:#ffd36b;opacity:.8}
.vq{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border-radius:16px;padding:10px 12px;background:rgba(255,255,255,.05);border:1px dashed rgba(255,211,107,.4);color:#fff;cursor:pointer;font:inherit}
.vqt{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}.vqt small{font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:800;color:#ffd36b}.vqt b{font-family:"Crimson Pro",Georgia,serif;font-weight:500;font-style:italic;font-size:18.5px;line-height:1.3}
.vqp{width:30px;height:30px;border-radius:50%;border:1px solid rgba(255,211,107,.5);display:grid;place-items:center;color:#ffd36b;font-weight:800;flex:none}
.vgroup{display:flex;flex-direction:column;gap:8px}
.vgh{font-size:12px;letter-spacing:.16em;text-transform:uppercase;font-weight:800;color:#ffd36b;margin-top:4px;display:flex;align-items:center;gap:8px}.vgh::after{content:"";flex:1;height:1px;background:rgba(255,211,107,.35)}
.vcats{display:flex;flex-wrap:wrap;gap:6px}.vcats button{display:inline-flex;align-items:center;gap:5px;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.08);color:#fff;border-radius:999px;padding:5px 11px;font-size:13.5px;font-weight:700;cursor:pointer}.vcats button[aria-pressed="true"]{background:#ffd36b;color:#3a2550;border-color:#ffd36b}
.vtip{text-align:center;font-style:italic;color:#ffd36b;opacity:.9}
.vcard{display:flex;align-items:center;gap:12px;border-radius:18px;padding:12px 12px 12px 14px;background:rgba(255,255,255,.07);border:1px solid rgba(255,211,107,.3)}
.vemo{width:42px;height:42px;align-self:flex-start;border-radius:50%;background:rgba(255,211,107,.14);display:grid;place-items:center;flex:none}
.vtx{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.vtx b{font-family:"Crimson Pro",Georgia,serif;font-weight:500;font-size:19px;line-height:1.3;color:#fff;overflow-wrap:break-word}
.vtx small{font-size:12.5px;color:#ffd36b;font-weight:700}

.pcounts{display:flex;flex-wrap:wrap;gap:6px}.pc1{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:999px;padding:2px 8px 2px 5px;font-size:12.5px;background:var(--card)}

.projs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-flow:row dense;gap:10px}

.pjt{display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left;border:0;border-radius:20px;padding:12px;min-height:104px;background:linear-gradient(150deg,var(--pc),color-mix(in srgb,var(--pc) 70%,#000));color:#fff;cursor:pointer;box-shadow:0 8px 18px color-mix(in srgb,var(--pc) 30%,transparent);position:relative;overflow:hidden}

.pjband{margin:0 -12px 2px;padding:9px 12px;background:var(--pc);color:#fff}.pjband .pjp{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.45);color:#fff}.pjband .pjp[aria-pressed="true"]{background:#fff;border-color:#fff;color:var(--pc)}
.pj.focus{box-shadow:0 0 0 2px color-mix(in srgb,var(--pc) 35%,transparent)}
.pjtop{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.pjtop b{flex:1 1 140px;font-size:16px;line-height:1.25;overflow-wrap:anywhere}
.pjp{border:1px solid var(--line);background:var(--card);color:var(--muted);border-radius:999px;padding:2px 9px;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap}

.pjnext{width:100%;border:0;border-bottom:1px dashed var(--line);background:transparent;color:var(--ink);font:inherit;font-size:15px;padding:4px 0;outline:none}.pjnext:focus{border-bottom-color:var(--pc)}
.pjrow{display:flex;flex-wrap:wrap;gap:6px;align-items:center}.pjrow .msg{font-size:12.5px;color:var(--muted)}
.proj{display:flex;flex-direction:column;gap:8px}
.proj{overflow:hidden}
.proj .phead{margin:-16px -16px 4px;padding:14px 16px;background:var(--pc);color:#fff}
.proj .pill{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.4);color:#fff}
.proj .pill[aria-pressed="true"],.proj .pill.pinp[aria-pressed="true"]{background:#fff;border-color:#fff;color:var(--pc)}
.phead{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.phead b{font-family:var(--display);font-weight:700;font-size:19px;line-height:1.1;overflow-wrap:anywhere}
.pills{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.pill{font-size:13px;white-space:nowrap;border:1px solid var(--line);background:var(--bg);color:var(--muted);border-radius:999px;padding:3px 10px;cursor:pointer}

.meta{font-size:15px;color:var(--muted)}

.tracker{display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--line);padding-top:8px}
.trow{display:grid;grid-template-columns:1fr 128px auto;gap:8px;align-items:center}
.trow a{color:var(--ink);font-weight:500;overflow-wrap:anywhere}
.trow select{font-size:15px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:5px 6px}

.fsum .frow span:last-child{font-family:var(--mono);text-align:right;color:var(--muted)}

/* week */
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.wk2 .day{padding:6px 2px 4px;border-radius:12px}.wk2 .day .num{font-size:18px}.wk2 .dots{color:var(--accent);font-size:13px;line-height:1;height:12px;letter-spacing:1px}.wk2 .day.sel .dots{color:#fff}
.wksec .sechead{margin-bottom:8px}
.day{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px 2px;text-align:center;font-size:12.5px;color:var(--muted);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px;box-shadow:var(--shadow)}

.nav button{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:4px 12px;cursor:pointer;font-size:15px}

/* us */
.duo{display:grid;grid-template-columns:1fr 1fr;border-radius:26px;overflow:hidden;box-shadow:var(--shadow)}
.city{position:relative;overflow:hidden;color:#fff;padding:16px 14px 46px;background:linear-gradient(165deg,var(--s1),var(--s2) 58%,var(--s3))}
.city::after{content:"";position:absolute;width:140px;height:140px;right:-40px;top:-50px;border-radius:50%;background:radial-gradient(circle,var(--orb),transparent 68%);pointer-events:none}
.city>*{position:relative;z-index:1}
.city .who{font-size:13px;letter-spacing:.1em;text-transform:uppercase;font-weight:600;opacity:.92}

.city .pl{font-size:14px;opacity:.9}
.together{background:var(--c-love,#8c2f55);color:#fff;border:0;border-radius:22px;padding:16px;box-shadow:var(--shadow);text-align:center;display:flex;flex-direction:column;align-items:center;gap:2px}

.tbox{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:100%;margin:8px 0 4px}
.tb{background:rgba(255,255,255,.14);border-radius:14px;padding:10px 4px;display:flex;flex-direction:column;align-items:center}

.together .dt{color:rgba(255,255,255,.88);font-size:15px}
.together .lbl{color:rgba(255,255,255,.85)}
.together .ghost{background:#fff;color:#8c2f55;border:0;font-weight:600}
.pray{background:linear-gradient(165deg,#14244f,#22397a 55%,#2e4d93);color:#fff;border:0;position:relative;overflow:hidden}
.pray>*{position:relative;z-index:1}
.pray .stars{opacity:.7;z-index:0}
.pray h2{color:#fff}.pray .hint,.pray .meta{color:rgba(255,255,255,.78)}

.dots{display:flex;gap:7px;flex-wrap:wrap}

.pcard{display:flex;flex-direction:column;gap:12px}
.pchead{display:flex;align-items:center;gap:12px}
.mini{width:48px;height:48px;border-radius:50%;background:var(--calm-soft);color:var(--calm);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:800;font-size:20px;flex:none;overflow:hidden}

.ro-list li.ok{color:var(--muted);text-decoration:line-through}

.plan:first-child{border-top:0}
.plan span{flex:1;overflow-wrap:anywhere}

/* tab bar */
.tabbar{position:fixed;z-index:20;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));width:min(calc(100% - 32px),480px);
  background:color-mix(in srgb,var(--card) 86%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border:1px solid var(--line);border-radius:26px;box-shadow:0 12px 34px rgba(31,24,48,.18);display:grid;grid-template-columns:repeat(4,1fr);padding:6px}

.tabbar svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabbar button[aria-current="page"]{color:var(--ink);font-weight:700;background:color-mix(in srgb,var(--ink) 11%,transparent)}

/* timer bar */
.timerbar{position:fixed;left:0;right:0;z-index:19;bottom:calc(90px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.timerbar .in{max-width:480px;width:100%;background:linear-gradient(135deg,#2b2458,#7a3466);color:#fff;border-radius:20px;padding:10px 14px;display:flex;align-items:center;gap:12px;box-shadow:0 10px 28px rgba(31,24,48,.3)}
.timerbar .in div{flex:1;min-width:0}
.timerbar small{display:block;font-size:12px;opacity:.8;letter-spacing:.08em;text-transform:uppercase}
.timerbar b{display:block;overflow-wrap:anywhere}
.timerbar .clk{font-family:var(--mono);font-size:22px;font-variant-numeric:tabular-nums;flex:none}
.timerbar button{background:#fff;color:#2b2458;border:0;border-radius:999px;padding:7px 14px;font-weight:600;cursor:pointer}

/* sheet */
.sheet{position:fixed;inset:0;z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet .bd{position:absolute;inset:0;background:rgba(17,12,30,.45);backdrop-filter:blur(2px)}
.sheet .pn{position:relative;background:var(--card);width:100%;max-width:560px;max-height:88vh;overflow:auto;border-radius:26px 26px 0 0;
  padding:18px max(16px,env(safe-area-inset-right,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
.sheet .sh{display:flex;align-items:center;justify-content:space-between;gap:10px}

.sheet .body{display:flex;flex-direction:column;gap:12px}
.dows{display:flex;gap:4px;flex-wrap:wrap}
.dows label{display:flex;align-items:center;justify-content:center;width:40px;height:34px;border:1px solid var(--line);border-radius:10px;font-size:14px;cursor:pointer;user-select:none}
.dows input{position:absolute;opacity:0;width:1px;height:1px}
.dows label:has(input:checked){background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.cp{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.cp .what{flex:1}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.setrow input[type=time]{width:auto}

/* toast */
.toast{position:fixed;z-index:60;top:calc(10px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);width:min(92vw,420px);
  background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border:1px solid var(--line);border-radius:22px;padding:12px 14px;box-shadow:0 14px 34px rgba(0,0,0,.2);display:flex;gap:12px;align-items:flex-start}
.toast .ic{width:38px;height:38px;border-radius:11px;background:linear-gradient(160deg,#3a2a6a,#cf3d66);color:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:800;font-size:15px;flex:none}
.toast small{display:block;color:var(--muted);font-size:13px}
.toast b{display:block;font-size:15px}
.toast p{margin:0;font-size:15px}
@media (prefers-reduced-motion:no-preference){.toast{animation:drop .35s ease-out}@keyframes drop{from{transform:translate(-50%,-20px);opacity:0}}
  main.wrap>*{animation:rise .4s ease-out both}main.wrap>*:nth-child(2){animation-delay:.04s}main.wrap>*:nth-child(3){animation-delay:.08s}main.wrap>*:nth-child(4){animation-delay:.12s}
  @keyframes rise{from{transform:translateY(8px)}}}

<script>

const pad=n=>String(n).padStart(2,"0");

const fmt=m=>{m=((m%1440)+1440)%1440;let h=Math.floor(m/60),mi=m%60,ap=h>=12?"PM":"AM";h=h%12||12;return h+":"+pad(mi)+" "+ap};

  const p={};new Intl.DateTimeFormat("en-US",{timeZone:tz,year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",hourCycle:"h23"})

/* ---------- state ---------- */
const LKEY="ourdays-ui-1";

let UI={};try{UI=JSON.parse(localStorage.getItem(LKEY))||{}}catch(e){}
let S={viewAs:null,tab:UI.tab||"today",theme:UI.theme||"system",timer:UI.timer||null,people:{},shared:{countdowns:[],prayer:{log:{},tonight:{}},plans:[]}};
function saveLocal(){try{localStorage.setItem(LKEY,JSON.stringify({tab:S.tab,theme:S.theme,timer:S.timer}))}catch(e){}}
const ui={weekOff:0,sel:null,habitEdit:false,projEdit:null};
const P=id=>S.people[id];
const me=()=>S.viewAs;
const partnerOf=id=>P(id).partner;

/* ---------- sync ---------- */
let PREVIEW=null,DB=null,AUTH=null,ME=null,CID=null,PARTNER=null,unsubs=[],partnerUnsubs=[];
const sent={};
const clean=o=>JSON.parse(JSON.stringify(o===undefined?null:o));
const js=o=>JSON.stringify(o);
const coupleRef=()=>DB.doc("couples/"+CID);
const personRef=u=>DB.doc("couples/"+CID+"/people/"+u);
const dayRef=(u,k)=>DB.doc("couples/"+CID+"/people/"+u+"/days/"+k);
const extraRef=u=>DB.doc("couples/"+CID+"/people/"+u+"/extra/photo");
const sharedRef=()=>DB.doc("couples/"+CID+"/shared/main");
let syncT=null;
let dirty=false;
/* fields that live elsewhere (their own docs) or only on this device: never written into people/{me} */
const PSKIP=new Set(["days","partner","photo","loaded","photoLoaded","daysLoaded","cal","avatar","presence","status","need","pcLog","cyclePub","cycle","cycleLoaded","money","moneyLoaded","moneySum"]);
/* what the database had for each field when we last heard from it; a device only writes the fields it changed,
   so a phone that is behind can never wipe out what was typed on the laptop (and the other way round) */
let pbase=null;
function writePerson(doc){const ref=personRef(ME);
  if(!pbase){const v=js(doc);if(sent.person===v)return;sent.person=v;ref.set(clean(doc),{merge:true}).catch(syncErr);pbase={};for(const k in doc)pbase[k]=js(doc[k]);return}
  const upd={},keys=new Set([...Object.keys(doc),...Object.keys(pbase)]);
  keys.forEach(k=>{if(PSKIP.has(k))return;const v=js(doc[k]);if(v===pbase[k])return;upd[k]=doc[k]===undefined?firebase.firestore.FieldValue.delete():clean(doc[k]);pbase[k]=doc[k]===undefined?undefined:v});
  PSKIP.forEach(k=>{if(pbase[k]!==undefined){upd[k]=firebase.firestore.FieldValue.delete();delete pbase[k]}});
  if(!Object.keys(upd).length)return;ref.update(upd).catch(e=>{if(e&&e.code==="not-found")ref.set(clean(doc),{merge:true}).catch(syncErr);else syncErr(e)})}
/* safety copies: one per 3 hours of the day, kept 10 days, in this person's own space (extra/hist-...) */
function histSnap(doc){if(!DB||!CID)return;const n=tzNow(P(ME).tz),slot=n.key+"-"+String(Math.floor(n.min/180)*3).padStart(2,"0");if(sent["hist"]===slot)return;sent["hist"]=slot;
  const keep={};["papers","projects","vision","mission","habits","countdowns","goals","name","city","tz"].forEach(k=>{if(doc[k]!==undefined)keep[k]=doc[k]});
  DB.doc("couples/"+CID+"/people/"+ME+"/extra/hist-"+slot).set(clean({at:Date.now(),...keep})).catch(()=>{});
  const old=addDays(n.key,-10);try{DB.collection("couples/"+CID+"/people/"+ME+"/extra").get().then(q=>q.docs.forEach(d=>{if(/^hist-/.test(d.id)&&d.id.slice(5,15)<old)d.ref.delete().catch(()=>{})})).catch(()=>{})}catch(e){}}
function persist(){if(PREVIEW)return;saveLocal();if(!ME||!CID)return;dirty=true;clearTimeout(syncT);syncT=setTimeout(flush,400)}
function hasContent(d){return d&&((d.tasks&&d.tasks.length)||(d.done&&d.done.length)||(d.skip&&d.skip.length)||(d.habits&&d.habits.length)||(d.checkin&&Object.keys(d.checkin).length))}
function flush(){
  if(!DB||!ME||!CID)return;const p=S.people[ME];if(!p||!p.loaded)return;dirty=false;
  const cutoff=addDays(tzNow(p.tz).key,-120);
  if(p.focus)Object.keys(p.focus).forEach(k=>{if(k<cutoff)delete p.focus[k]});

/* ---------- updates: reload when a newer version is published ---------- */
const APP_VERSION="2026-11-23-b";
async function checkUpdate(){try{const r=await fetch("version.txt?t="+Date.now(),{cache:"no-store"});if(!r.ok)return;const v=(await r.text()).trim();
  if(v&&v!==APP_VERSION){const a=document.activeElement;if(a&&/^(INPUT|TEXTAREA)$/.test(a.tagName))return;if(navigator.serviceWorker&&navigator.serviceWorker.controller){const reg=await navigator.serviceWorker.getRegistration();if(reg)await reg.update().catch(()=>{})}try{if(sessionStorage.getItem("odReload")===v)return;sessionStorage.setItem("odReload",v)}catch(e){}location.reload()}}catch(e){}}
document.addEventListener("visibilitychange",()=>{if(!document.hidden)checkUpdate()});
setTimeout(checkUpdate,3000);setInterval(checkUpdate,15*60000);
